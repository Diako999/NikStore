name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-backend:
    name: Backend — Unit + E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nikstore/package-lock.json

      - name: Install dependencies
        working-directory: nikstore
        run: npm ci

      - name: Lint
        working-directory: nikstore
        run: npm run lint

      - name: Unit tests
        working-directory: nikstore
        run: npm run test:cov

      - name: E2E tests
        working-directory: nikstore
        run: npm run test:e2e -- --forceExit
        # No MongoDB/Redis service needed — MongoMemoryServer + ioredis-mock

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: nikstore/coverage
          flags: backend
        continue-on-error: true
