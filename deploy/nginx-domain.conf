# ─────────────────────────────────────────────────────────────────────────────
# NikStore — nginx for nikstoree.ir (storefront), www (redirect) and admin.nikstoree.ir
# This is the config running in production (Ubuntu 24.04 / nginx 1.24).
#
# Setup (DNS A records for the three names must already point at this server):
#   1. mkdir -p /var/www/html/.well-known/acme-challenge        (default site serves it)
#   2. certbot certonly --webroot -w /var/www/html \
#        -d nikstoree.ir -d www.nikstoree.ir -d admin.nikstoree.ir \
#        --deploy-hook "systemctl reload nginx"
#      add  -m you@example.com  (expiry notices) or  --register-unsafely-without-email
#   3. cp deploy/nginx-domain.conf /etc/nginx/sites-available/nikstore
#      ln -s /etc/nginx/sites-available/nikstore /etc/nginx/sites-enabled/nikstore
#      rm -f /etc/nginx/sites-enabled/default
#   4. nginx -t && systemctl reload nginx
# To use another domain: sed -i 's/nikstoree.ir/YOUR_DOMAIN/g' on the copy.
#
# Syntax note: nginx 1.24 needs "listen 443 ssl http2;" - the "http2 on;" directive only
# exists from nginx 1.25.1 and makes "nginx -t" fail with: unknown directive "http2".
# ─────────────────────────────────────────────────────────────────────────────
# Differences from the original template, and why:
#  1. admin.nikstoree.ir is added to the HTTP->HTTPS redirect (it was left on the default site)
#  2. admin gets client_max_body_size + the same security headers (image uploads from the admin
#     panel are up to 5 MB; nginx's 1 MB default would reject them)
#  3. the /api rate limit is raised: 30 requests/min per IP would throttle ordinary browsing
#     (one page = several API calls) and whole mobile-carrier NATs. The backend has its own limits.

limit_req_zone $binary_remote_addr zone=api_ssl:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=gen_ssl:10m rate=60r/s;

# HTTP -> HTTPS (also answers the ACME challenge for certificate renewal)
server {
    listen 80;
    listen [::]:80;
    server_name nikstoree.ir www.nikstoree.ir admin.nikstoree.ir;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# www -> non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nikstoree.ir;
    ssl_certificate     /etc/letsencrypt/live/nikstoree.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikstoree.ir/privkey.pem;
    return 301 https://nikstoree.ir$request_uri;
}

# Storefront + API + uploads
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nikstoree.ir;

    ssl_certificate     /etc/letsencrypt/live/nikstoree.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikstoree.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        limit_req zone=api_ssl burst=100 nodelay;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host $host;
        expires            30d;
        add_header         Cache-Control "public, immutable";
        add_header         X-Content-Type-Options "nosniff" always;
    }

    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    location / {
        limit_req zone=gen_ssl burst=50 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# Admin panel
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.nikstoree.ir;

    ssl_certificate     /etc/letsencrypt/live/nikstoree.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikstoree.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "same-origin"                          always;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade_admin;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }
}

map $http_upgrade $connection_upgrade_admin {
    default upgrade;
    ''      close;
}
